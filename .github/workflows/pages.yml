# web 폴더를 GitHub Pages 로 올린다.
#
# 설정 화면에 들어갈 필요가 없다. configure-pages 의 enablement 가 Pages 자체를
# 켜 주므로, main 에 밀어 넣기만 하면 처음부터 알아서 배포된다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # 저장소 Actions 탭에서 손으로도 돌릴 수 있게

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한 번에 하나만 돈다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # enablement: 저장소에 Pages 가 아직 켜져 있지 않으면 여기서 켠다.
      # 이게 없으면 첫 배포가 "Get Pages site failed" 로 실패한다(실측).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 서버가 필요 없는 정적 파일만 올린다. server 폴더는 올라가지 않는다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
