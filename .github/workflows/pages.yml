# web 폴더를 GitHub Pages 로 올린다.
#
# 처음 한 번만 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 바꿔야 한다.
# 그 뒤로는 main 에 밀어 넣을 때마다 알아서 갱신된다.
#
# configure-pages 의 enablement 옵션으로 이 한 번을 없애 보려 했으나 실패했다.
# 워크플로 토큰(GITHUB_TOKEN)에는 Pages 사이트를 새로 만들 권한이 없어
# "Resource not accessible by integration" 이 난다. 사람이 한 번 켜 주어야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # 저장소 Actions 탭에서 손으로도 돌릴 수 있게

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한 번에 하나만 돈다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      # 서버가 필요 없는 정적 파일만 올린다. server 폴더는 올라가지 않는다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
